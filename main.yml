---

- name: Grepmam Environment
  hosts: computer_group
  gather_facts: true

  tasks:

    - name: Import General Tools Role...
      ansible.builtin.import_role:
        name: general_tools
      tags: general

    - name: Import Fonts Role...
      ansible.builtin.import_role:
        name: fonts
      vars:
        fonts_user_home: "{{ user.home }}"
      tags: fonts

    - name: Import Picom role...
      ansible.builtin.import_role:
        name: picom
      vars:
        picom_user_home: "{{ user.home }}"
      tags: picom

    - name: Import Polybar role...
      ansible.builtin.import_role:
        name: polybar
      vars:
        polybar_user_home: "{{ user.home }}"
        polybar_theme: "{{ theme }}"
      tags: polybar

    - name: Import Wezterm role...
      ansible.builtin.import_role:
        name: wezterm
      vars:
        wezterm_user_home: "{{ user.home }}"
        wezterm_theme: "{{ theme }}"
      tags: wezterm

    - name: Import dunst role...
      ansible.builtin.import_role:
        name: dunst
      vars:
        dunst_user_home: "{{ user.home }}"
        dunst_theme: "{{ theme }}"
      tags: dunst

    - name: Import Flameshot role...
      ansible.builtin.import_role:
        name: flameshot
      vars:
        flameshot_user_home: "{{ user.home }}"
      tags: flameshot

    - name: Import Rofi role...
      ansible.builtin.import_role:
        name: rofi
      vars:
        rofi_user_home: "{{ user.home }}"
        rofi_theme: "{{ theme }}"
      tags: rofi

    - name: Import Feh role...
      ansible.builtin.import_role:
        name: feh
      vars:
        feh_user_home: "{{ user.home }}"
        feh_theme: "{{ theme }}"
      tags: feh
  
    - name: Import mpv role...
      ansible.builtin.import_role:
        name: mpv
      vars:
        mpv_user_home: "{{ user.home }}"
      tags: mpv

    #- name: Import LightDM role...
    #  ansible.builtin.import_role:
    #    name: lightdm
    #  vars:
    #    lightdm_user_home: "{{ user.home }}"
    #  tags: lightdm

    - name: Import i3 role...
      ansible.builtin.import_role:
        name: i3
      vars: 
        i3_user_home: "{{ user.home }}"
        i3_user: "{{ user.name }}"
        i3_theme: "{{ theme }}"
      tags: i3

    - name: Import Neofetch role...
      ansible.builtin.import_role:
        name: neofetch
      vars:
        neofetch_user_home: "{{ user.home }}"
      tags: neofetch

    - name: Import ZSH role...
      ansible.builtin.import_role:
        name: zsh
      vars:
        zsh_user_home: "{{ user.home }}"
        zsh_user: "{{ user.name }}"
      tags: zsh

    - name: Import LSD role...
      ansible.builtin.import_role:
        name: lsd
      vars:
        lsd_user_home: "{{ user.home }}"
        lsd_theme: "{{ theme }}"
      tags: lsd

...
